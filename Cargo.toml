[package]
name = "krypto"
version = "0.7.0"
edition = "2021"

[[bin]]
name = "krypto"
path = "src/bin/krypto.rs"

[dependencies]
anyhow = "1.0.100"
binance-rs-async = { version = "1.3.3", features = ["margin_api"] }
reqwest = { version = "0.11", features = ["json"] }
chrono = { version = "0.4.42", features = ["serde"] }
comfy-table = "=7.1.1"
futures = "0.3.31"
home = "=0.5.5"
libc = "0.2"
ndarray = "0.15"
ndarray-stats = "0.6.0"
polars = { version = "0.37", features = ["lazy", "ndarray", "temporal", "serde", "dynamic_group_by", "abs", "diff", "pct_change", "rolling_window", "ewma", "round_series", "cross_join", "parquet", "csv"] }
rayon = "1.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
colored = "2.1"
rand = "0.8"
indicatif = "0.17"
plotters = { version = "0.3.7", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "chrono", "line_series"] }
bincode = "1.3"

[target.'cfg(windows)'.dependencies]
plotters = "0.3.7"
